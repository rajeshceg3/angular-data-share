<section aria-labelledby="sibling-title">
  <h3 id="sibling-title">Another component</h3>
  <p data-testid="sibling-message">{{ message$ | async }}</p>
  <label for="message">Message</label>
  <input id="message" type="text" #messageText>
  <button type="button" (click)="newMessage(messageText.value)">Send Message</button>
</section>
